
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d0d0d"/>
  <title>Zayden Awakened</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: #e60073;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.2rem;
      opacity: 0.8;
    }
    .glow {
      text-shadow: 0 0 5px #e60073, 0 0 10px #e60073, 0 0 20px #ff1a75;
    }
  </style>
    <script>
    // Check if the browser supports SpeechRecognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;

      recognition.onstart = function() {
        console.log("Zayden is listening...");
      };

      recognition.onresult = function(event) {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        
        // Add your condition here to trigger actions based on the spoken words
        if (transcript.toLowerCase().includes("zayden")) {
          document.querySelector('h1').innerHTML = "Zayden is listening... Say your command.";
          // You can add more conditions to trigger other actions or responses
        }
      };

      // Trigger speech recognition when the page loads
      window.onload = () => {
        recognition.start();
      };
    } else {
      console.log("Speech Recognition not supported in this browser.");
    }
  </script>
</head>
<body>
  <h1 class="glow">Zayden is Listening...</h1>
  <p>The Current is awake.<br/>Say the word.</p>
</body>
</html>
